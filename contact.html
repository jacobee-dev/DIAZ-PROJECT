<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <h2><i class="fa-solid fa-graduation-cap"></i> YouthEdu</h2>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="ethics.html">Privacy</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="page">
        <div class="contact-box">

            <i class="fa-solid fa-paper-plane big-icon"></i>

            <h1>Contact Us</h1>

            <p>
                Have a question or want to learn more about our program?
                Send us a message.
            </p>

            <form>
                <label for="name">
                    <i class="fa-solid fa-user"></i> Name
                </label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>

                <label for="email">
                    <i class="fa-solid fa-envelope"></i> Email
                </label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>

                <label for="message">
                    <i class="fa-solid fa-message"></i> Message
                </label>
                <textarea id="message" name="message"
                          placeholder="Write your message..." rows="5"
                          required></textarea>

                <button type="submit">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                </button>
            </form>

        </div>
    </main>

    <footer>
        <p>© 2026 YouthEdu | Educational Youth Program</p>
    </footer>

</body>
</html>
